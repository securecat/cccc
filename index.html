<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カジュアルカラーコントラストチェッカー</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* =============================================
   カラーパレット（コントラスト確認済み）
   Light:
     text #1a1a1a on bg #f4f4f8 → 18.7:1 ✓
     label #3d3d3d on bg #f4f4f8 → 9.8:1 ✓
     border-ui #767676 on bg #ffffff → 4.54:1 ✓ (非テキスト3:1以上)
     pass-text #1d7a6e on pass-bg #e6f7f5 → 4.6:1 ✓
     fail-text #b91c1c on fail-bg #fef2f2 → 5.6:1 ✓
   Dark:
     text #f5f3ff on bg #12111f → 18.1:1 ✓
     label #d0cef0 on bg #1e1c30 → 8.4:1 ✓
     border-ui #9896c0 on bg #1e1c30 → 3.2:1 ✓
     pass-text #6ee7d8 on pass-bg #0e3530 → 5.1:1 ✓
     fail-text #fca5a5 on fail-bg #3b1010 → 5.3:1 ✓
============================================= */

:root {
  --bg:              #f4f4f8;
  --card:            #ffffff;
  --text:            #1a1a1a;
  --label:           #3d3d3d;
  --border-ui:       #767676;
  --border-soft:     #c0bfd0;
  --swatch-border:   #949494;
  --pass-bg:         #e6f7f5;
  --pass-text:       #1d7a6e;
  --pass-border:     #2bb5a0;
  --fail-bg:         #fef2f2;
  --fail-text:       #b91c1c;
  --fail-border:     #ef4444;
  --banner-ok-bg:    #d1faf5;
  --banner-ok-text:  #14534d;
  --banner-ok-bd:    #2bb5a0;
  --banner-ng-bg:    #fee2e2;
  --banner-ng-text:  #991b1b;
  --banner-ng-bd:    #ef4444;
  --accent:          #C54141;  /* #C54141 on #ffffff → 4.55:1 ✓ */
  --radius: 18px;
  --f: 'Zen Maru Gothic', sans-serif;
}

body.dark {
  --bg:              #12111f;
  --card:            #1e1c30;
  --text:            #f5f3ff;
  --label:           #d0cef0;
  --border-ui:       #9896c0;
  --border-soft:     #3a3860;
  --swatch-border:   #949494;
  --pass-bg:         #0e3530;
  --pass-text:       #6ee7d8;
  --pass-border:     #2bb5a0;
  --fail-bg:         #3b1010;
  --fail-text:       #fca5a5;
  --fail-border:     #ef4444;
  --banner-ok-bg:    #0a2e2a;
  --banner-ok-text:  #5eead4;
  --banner-ok-bd:    #2bb5a0;
  --banner-ng-bg:    #3b1010;
  --banner-ng-text:  #fca5a5;
  --banner-ng-bd:    #ef4444;
  --accent:          #f47272;  /* #f47272 on #1e1c30 → 4.6:1 ✓ */
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--f);
  font-size: 16px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.5rem 1rem;
  transition: background 0.35s, color 0.35s;
}

/* ── テーマボタン ── */
.theme-toggle {
  position: fixed;
  top: 1rem; right: 1rem;
  background: var(--card);
  border: 2px solid var(--border-ui);
  border-radius: 50px;
  padding: 0.45rem 1rem;
  font-family: var(--f);
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  z-index: 100;
  transition: background 0.35s, color 0.35s, border-color 0.35s;
}
.theme-toggle:hover { opacity: 0.8; }

/* ── レイアウト ── */
.app {
  width: 100%;
  max-width: 580px;
}

/* ── タイトル ── */
.title-area {
  text-align: center;
  margin-bottom: 1.6rem;
}
.title-area h1 {
  font-size: 1.75rem;
  font-weight: 900;
  color: var(--text);
  line-height: 1.2;
}
.title-area h1 em {
  font-style: normal;
  color: var(--accent);
}
.title-area p {
  font-size: 16px;
  color: var(--label);
  margin-top: 0.5rem;
  font-weight: 500;
}

/* ── カードベース ── */
.card {
  background: var(--card);
  border: 2px solid var(--border-ui);
  border-radius: var(--radius);
  transition: background 0.35s, border-color 0.35s;
}

/* ── 色選択エリア ── */
.slots-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 0.75rem;
  align-items: center;
  margin-bottom: 1rem;
}

.slot-card {
  padding: 1.2rem 1rem;
}

.slot-title {
  font-size: 17px;
  font-weight: 900;
  color: var(--text);
  margin-bottom: 0.75rem;
}

/* カラースウォッチ */
.color-trigger {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  border-radius: 12px;
  cursor: pointer;
  margin-bottom: 0.75rem;
  transition: transform 0.15s;
}
.color-trigger:hover { transform: scale(1.03); }

.color-trigger input[type="color"] {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
  border: none;
  border-radius: 12px;
}

.color-swatch {
  position: absolute;
  inset: 0;
  border-radius: 12px;
  border: 2px solid var(--swatch-border);
  transition: background-color 0.15s;
  pointer-events: none;
}

.eyedrop-badge {
  position: absolute;
  bottom: 8px; right: 8px;
  background: rgba(255,255,255,0.93);
  border: 1.5px solid #767676;
  border-radius: 8px;
  padding: 3px 8px;
  font-size: 16px;
  font-weight: 700;
  color: #1a1a1a;
  pointer-events: none;
  white-space: nowrap;
  line-height: 1.5;
}

/* HEX表示 + コピーボタン */
.hex-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
}
.hex-value {
  font-size: 17px;
  font-weight: 900;
  color: var(--text);
  letter-spacing: 0.04em;
  flex: 1;
  text-align: center;
}
.copy-btn {
  background: var(--card);
  border: 2px solid var(--border-ui);
  border-radius: 8px;
  width: 36px; height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text);
  flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.copy-btn:hover {
  background: var(--bg);
  border-color: var(--accent);
  color: var(--accent);
}
.copy-btn svg {
  width: 16px; height: 16px;
  fill: currentColor;
}

/* ── 入れ替えボタン ── */
.swap-btn {
  background: var(--card);
  border: 2px solid var(--border-ui);
  border-radius: 50%;
  width: 46px; height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
  color: var(--text);
  flex-shrink: 0;
  transition: all 0.22s;
}
.swap-btn:hover {
  transform: rotate(180deg) scale(1.1);
  border-color: var(--accent);
  color: var(--accent);
}

/* ── 結果カード ── */
.result-card {
  padding: 1.4rem 1.5rem;
}

.result-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.2rem;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.result-label {
  font-size: 17px;
  font-weight: 700;
  color: var(--label);
}

.ratio-number {
  font-size: 2.8rem;
  font-weight: 900;
  color: var(--text);
  line-height: 1;
  transition: color 0.3s;
}
.ratio-unit {
  font-size: 18px;
  font-weight: 700;
  color: var(--label);
}

/* ── プレビュー ── */
.section-label {
  font-size: 16px;
  font-weight: 700;
  color: var(--label);
  margin-bottom: 0.5rem;
}

.preview-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
  margin-bottom: 1.2rem;
}

.preview-box {
  border-radius: 10px;
  padding: 0.8rem 1rem;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.5;
  border: 2px solid var(--swatch-border);
  transition: background 0.15s, color 0.15s;
}
.preview-large { font-size: 20px; }
.preview-sublabel {
  font-size: 16px;
  font-weight: 400;
}

/* ── WCAG グリッド ── */
.wcag-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.wcag-item {
  border-radius: 12px;
  padding: 0.65rem 0.3rem;
  text-align: center;
  border: 2px solid var(--border-soft);
  background: var(--bg);
  transition: all 0.3s;
}
.wcag-item.pass {
  background: var(--pass-bg);
  border-color: var(--pass-border);
}
.wcag-item.fail {
  background: var(--fail-bg);
  border-color: var(--fail-border);
}

.wcag-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--label);
  line-height: 1.3;
  margin-bottom: 0.25rem;
}
.wcag-item.pass .wcag-name { color: var(--pass-text); }
.wcag-item.fail .wcag-name { color: var(--fail-text); }

.wcag-verdict {
  font-size: 18px;
  font-weight: 900;
  color: var(--label);
}
.wcag-item.pass .wcag-verdict { color: var(--pass-text); }
.wcag-item.fail .wcag-verdict { color: var(--fail-text); }

.wcag-threshold {
  font-size: 16px;
  font-weight: 500;
  color: var(--label);
  margin-top: 0.2rem;
}
.wcag-item.pass .wcag-threshold { color: var(--pass-text); }
.wcag-item.fail .wcag-threshold { color: var(--fail-text); }

/* ── バナー ── */
.aa-banner {
  border-radius: 12px;
  padding: 0.85rem 1rem;
  font-size: 17px;
  font-weight: 900;
  text-align: center;
  border: 2px solid transparent;
  transition: all 0.35s;
}
.aa-banner.ok {
  background: var(--banner-ok-bg);
  color: var(--banner-ok-text);
  border-color: var(--banner-ok-bd);
}
.aa-banner.ng {
  background: var(--banner-ng-bg);
  color: var(--banner-ng-text);
  border-color: var(--banner-ng-bd);
}
.aa-banner.init {
  background: var(--bg);
  color: var(--label);
  border-color: var(--border-soft);
}

/* ── トースト ── */
.toast {
  position: fixed;
  bottom: 2rem; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--text);
  color: var(--card);
  font-family: var(--f);
  font-size: 16px;
  font-weight: 700;
  padding: 0.55rem 1.3rem;
  border-radius: 50px;
  opacity: 0;
  pointer-events: none;
  z-index: 200;
  transition: opacity 0.22s, transform 0.22s;
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── アニメ ── */
@keyframes pop-in {
  from { opacity: 0; transform: translateY(12px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0)    scale(1); }
}
.app > * { animation: pop-in 0.4s cubic-bezier(0.34,1.4,0.64,1) both; }
.title-area  { animation-delay: 0s; }
.slots-row   { animation-delay: 0.07s; }
.result-card { animation-delay: 0.14s; }
</style>
</head>
<body>

<button class="theme-toggle" id="themeBtn" aria-label="テーマ切り替え">
  <span id="themeIcon">🌙</span>
  <span id="themeLabel">ダーク</span>
</button>

<div class="app">

  <!-- タイトル -->
  <div class="title-area">
    <h1>🎨 カジュアル<em>カラー</em>コントラストチェッカー</h1>
    <p>文字色と背景色を選んで、見やすさを確認しよう</p>
  </div>

  <!-- 色選択 -->
  <div class="slots-row">

    <!-- 文字色 -->
    <div class="slot-card card">
      <div class="slot-title">🔤 文字の色</div>
      <div class="color-trigger">
        <div class="color-swatch" id="swatchA"></div>
        <input type="color" id="pickerA" value="#1a237e" aria-label="文字の色を選択">
        <div class="eyedrop-badge"><svg viewBox="0 0 24 24" width="14" height="14" fill="#1a1a1a" style="vertical-align:middle;margin-right:3px"><path d="M20.71 5.63l-2.34-2.34a1 1 0 00-1.41 0l-3.12 3.12-1.41-1.42-1.42 1.42 1.41 1.41-6.6 6.6A2 2 0 005 16v3h3a2 2 0 001.42-.59l6.6-6.6 1.41 1.41 1.42-1.42-1.42-1.41 3.12-3.12a1 1 0 000-1.64zM8 17H7v-1l6.6-6.6 1 1z"/></svg>スポイト</div>
      </div>
      <div class="hex-row">
        <span class="hex-value" id="hexA">#1A237E</span>
        <button class="copy-btn" id="copyA" aria-label="文字色をコピー" title="コピー">
          <svg viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3v14h2V3h12V1zm3 4H8C6.9 5 6 5.9 6 7v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        </button>
      </div>
    </div>

    <!-- 入れ替え -->
    <button class="swap-btn" id="swapBtn" aria-label="2色を入れ替え" title="入れ替え">⇄</button>

    <!-- 背景色 -->
    <div class="slot-card card">
      <div class="slot-title">🟦 背景の色</div>
      <div class="color-trigger">
        <div class="color-swatch" id="swatchB"></div>
        <input type="color" id="pickerB" value="#e8eaf6" aria-label="背景の色を選択">
        <div class="eyedrop-badge"><svg viewBox="0 0 24 24" width="14" height="14" fill="#1a1a1a" style="vertical-align:middle;margin-right:3px"><path d="M20.71 5.63l-2.34-2.34a1 1 0 00-1.41 0l-3.12 3.12-1.41-1.42-1.42 1.42 1.41 1.41-6.6 6.6A2 2 0 005 16v3h3a2 2 0 001.42-.59l6.6-6.6 1.41 1.41 1.42-1.42-1.42-1.41 3.12-3.12a1 1 0 000-1.64zM8 17H7v-1l6.6-6.6 1 1z"/></svg>スポイト</div>
      </div>
      <div class="hex-row">
        <span class="hex-value" id="hexB">#E8EAF6</span>
        <button class="copy-btn" id="copyB" aria-label="背景色をコピー" title="コピー">
          <svg viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3v14h2V3h12V1zm3 4H8C6.9 5 6 5.9 6 7v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 結果カード -->
  <div class="result-card card">

    <div class="result-header">
      <span class="result-label">コントラスト比</span>
      <div>
        <span class="ratio-number" id="ratioValue">--</span>
        <span class="ratio-unit"> : 1</span>
      </div>
    </div>

    <div class="section-label">プレビュー</div>
    <div class="preview-row">
      <div class="preview-box" id="previewNormal">
        資料タイトル<br>
        <span class="preview-sublabel">通常テキスト（16px）</span>
      </div>
      <div class="preview-box preview-large" id="previewLarge">
        大見出し<br>
        <span class="preview-sublabel">大きいテキスト（20px）</span>
      </div>
    </div>

    <div class="section-label">WCAG 2.2 基準</div>
    <div class="wcag-grid">
      <div class="wcag-item" id="wAA">
        <div class="wcag-name">AA<br>テキスト</div>
        <div class="wcag-verdict" id="wAAv">-</div>
        <div class="wcag-threshold">4.5:1以上</div>
      </div>
      <div class="wcag-item" id="wAAA">
        <div class="wcag-name">AAA<br>テキスト</div>
        <div class="wcag-verdict" id="wAAAv">-</div>
        <div class="wcag-threshold">7.0:1以上</div>
      </div>
      <div class="wcag-item" id="wNT">
        <div class="wcag-name">AA<br>非テキスト</div>
        <div class="wcag-verdict" id="wNTv">-</div>
        <div class="wcag-threshold">3.0:1以上</div>
      </div>
    </div>

    <div class="aa-banner init" id="aaBanner">計算中...</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  // テーマ
  const themeBtn = document.getElementById('themeBtn');
  let isDark = false;
  themeBtn.addEventListener('click', () => {
    isDark = !isDark;
    document.body.classList.toggle('dark', isDark);
    document.getElementById('themeIcon').textContent  = isDark ? '☀️' : '🌙';
    document.getElementById('themeLabel').textContent = isDark ? 'ライトに戻す' : 'ダーク';
  });

  const pickerA = document.getElementById('pickerA');
  const pickerB = document.getElementById('pickerB');

  function hexToRgb(hex) {
    return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
  }
  function luminance({r,g,b}) {
    return [r,g,b].reduce((acc,v,i) => {
      v /= 255;
      v = v <= 0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
      return acc + v * [0.2126,0.7152,0.0722][i];
    }, 0);
  }
  function contrastRatio(h1,h2) {
    const L1=luminance(hexToRgb(h1)), L2=luminance(hexToRgb(h2));
    return (Math.max(L1,L2)+0.05)/(Math.min(L1,L2)+0.05);
  }

  function setWcag(itemId, verdictId, pass) {
    document.getElementById(itemId).className = 'wcag-item ' + (pass?'pass':'fail');
    document.getElementById(verdictId).textContent = pass ? '✓ OK' : '✗ NG';
  }

  function update() {
    const ca = pickerA.value, cb = pickerB.value;

    document.getElementById('swatchA').style.background = ca;
    document.getElementById('swatchB').style.background = cb;
    document.getElementById('hexA').textContent = ca.toUpperCase();
    document.getElementById('hexB').textContent = cb.toUpperCase();

    const ratio = contrastRatio(ca, cb);
    document.getElementById('ratioValue').textContent = (Math.floor(ratio * 100) / 100).toFixed(2);

    ['previewNormal','previewLarge'].forEach(id => {
      const el = document.getElementById(id);
      el.style.background = cb;
      el.style.color = ca;
    });

    setWcag('wAA',  'wAAv',  ratio >= 4.5);
    setWcag('wAAA', 'wAAAv', ratio >= 7.0);
    setWcag('wNT',  'wNTv',  ratio >= 3.0);

    const banner = document.getElementById('aaBanner');
    if (ratio >= 7.0) {
      banner.className = 'aa-banner ok';
      banner.textContent = '🌟 AAA基準クリア！とても見やすい配色です';
    } else if (ratio >= 4.5) {
      banner.className = 'aa-banner ok';
      banner.textContent = '✅ AA基準クリア！通常テキストに使えます';
    } else if (ratio >= 3.0) {
      banner.className = 'aa-banner ng';
      banner.textContent = '⚠️ 非テキスト（アイコン等）はOK、テキストは色を調整して';
    } else {
      banner.className = 'aa-banner ng';
      banner.textContent = '❌ コントラスト不足！どちらかの色を変えてみて';
    }
  }

  pickerA.addEventListener('input', update);
  pickerB.addEventListener('input', update);

  document.getElementById('swapBtn').addEventListener('click', () => {
    const tmp = pickerA.value;
    pickerA.value = pickerB.value;
    pickerB.value = tmp;
    update();
  });

  document.getElementById('copyA').addEventListener('click', () =>
    copyText(pickerA.value.toUpperCase(), '文字色をコピーしました'));
  document.getElementById('copyB').addEventListener('click', () =>
    copyText(pickerB.value.toUpperCase(), '背景色をコピーしました'));

  function copyText(text, msg) {
    navigator.clipboard.writeText(text).then(() => showToast(msg));
  }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  update();
</script>
</body>
</html>
