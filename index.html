<!DOCTYPE html>
<!-- CCCC v1.0.2 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カジュアルカラーコントラストチェッカー</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* =============================================
   カラーパレット（コントラスト確認済み）
   Light:
     text #1a1a1a on bg #f4f4f8 → 15.86:1 ✓ / on card #ffffff → 17.40:1 ✓
     label #3d3d3d on bg #f4f4f8 → 9.90:1 ✓ / on card #ffffff → 10.86:1 ✓
     border-ui #767676 on bg #f4f4f8 → 4.14:1 ✓ / on card #ffffff → 4.54:1 ✓ (非テキスト3:1以上)
     pass #14534d on card #ffffff → 8.85:1 ✓ (判定の文字・枠)
     fail #991b1b on card #ffffff → 8.31:1 ✓ (判定の文字・枠)
     focus #1a1a1a on bg #f4f4f8 → 15.86:1 ✓ / on card #ffffff → 17.40:1 ✓ (フォーカスインジケーター)
   Dark:
     text #f5f3ff on bg #12111f → 17.01:1 ✓ / on card #1e1c30 → 15.15:1 ✓
     label #d0cef0 on card #1e1c30 → 10.89:1 ✓
     border-ui #9896c0 on bg #12111f → 6.63:1 ✓ / on card #1e1c30 → 5.90:1 ✓
     pass #6ee7d8 on card #1e1c30 → 11.14:1 ✓
     fail #fca5a5 on card #1e1c30 → 8.75:1 ✓
     focus #f5f3ff on bg #12111f → 17.01:1 ✓ / on card #1e1c30 → 15.15:1 ✓
============================================= */

:root {
  --bg:              #f4f4f8;
  --card:            #ffffff;
  --text:            #1a1a1a;
  --label:           #3d3d3d;
  --border-ui:       #767676;
  --pass:            #14534d;
  --fail:            #991b1b;
  --focus:           #1a1a1a;
  --radius: 18px;
  --f: sans-serif;
}

body.dark {
  --bg:              #12111f;
  --card:            #1e1c30;
  --text:            #f5f3ff;
  --label:           #d0cef0;
  --border-ui:       #9896c0;
  --pass:            #6ee7d8;
  --fail:            #fca5a5;
  --focus:           #f5f3ff;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--f);
  font-size: 16px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.5rem 1rem;
}

/* フォーカスインジケーター（要素から離して表示する。色見本の hover の太い枠とも重ならない距離） */
:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 4px;
}

/* 視覚的に隠し、スクリーンリーダーには読ませる */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* ── テーマボタン ── */
.theme-toggle {
  position: fixed;
  top: 1rem; right: 1rem;
  background: var(--card);
  border: 2px solid var(--border-ui);
  border-radius: 50px;
  padding: 0.45rem 1rem;
  font-family: var(--f);
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  z-index: 100;
}

/* ── レイアウト ── */
.app {
  width: 100%;
  max-width: 580px;
}

/* ── タイトル ── */
.title-area {
  text-align: center;
  margin-bottom: 1.6rem;
}
.title-area h1 {
  font-size: 1.75rem;
  font-weight: 900;
  color: var(--text);
  line-height: 1.2;
}
.title-area p {
  font-size: 16px;
  color: var(--label);
  margin-top: 0.5rem;
  font-weight: 500;
}

/* ── カードベース ── */
.card {
  background: var(--card);
  border: 2px solid var(--border-ui);
  border-radius: var(--radius);
}

/* ── 色選択エリア ── */
.slots-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 0.75rem;
  align-items: center;
  margin-bottom: 1rem;
}

.slot-card {
  padding: 1.2rem 1rem;
}

.slot-title {
  font-size: 17px;
  font-weight: 900;
  color: var(--text);
  margin-bottom: 0.75rem;
}

/* カラースウォッチ（input[type="color"] そのものを色見本として表示する） */
.color-trigger {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  margin-bottom: 0.75rem;
}

.color-trigger input[type="color"] {
  display: block;
  width: 100%;
  height: 100%;
  padding: 0;
  border: 2px solid var(--border-ui);
  border-radius: 12px;
  background: none;
  cursor: pointer;
}
/* hover 時は枠を太くする（border を太くするとレイアウトがずれるため、外側に box-shadow を足す） */
.color-trigger input[type="color"]:hover {
  box-shadow: 0 0 0 2px var(--border-ui);
}
.color-trigger input[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}
.color-trigger input[type="color"]::-webkit-color-swatch {
  border: none;
  border-radius: 10px;
}
.color-trigger input[type="color"]::-moz-color-swatch {
  border: none;
  border-radius: 10px;
}

.eyedrop-badge {
  position: absolute;
  bottom: 8px; right: 8px;
  background: #ffffff;
  border: 1.5px solid #767676;
  border-radius: 8px;
  padding: 3px 8px;
  font-size: 16px;
  font-weight: 700;
  color: #1a1a1a;
  pointer-events: none;
  white-space: nowrap;
  line-height: 1.5;
}

/* HEX表示 + コピーボタン */
.hex-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
}
.hex-value {
  font-size: 17px;
  font-weight: 900;
  color: var(--text);
  letter-spacing: 0.04em;
  flex: 1;
  text-align: center;
}
.copy-btn {
  background: var(--card);
  border: 2px solid var(--border-ui);
  border-radius: 8px;
  width: 36px; height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text);
  flex-shrink: 0;
}
.copy-btn svg {
  width: 16px; height: 16px;
  fill: currentColor;
}

/* ── 入れ替えボタン ── */
.swap-btn {
  background: var(--card);
  border: 2px solid var(--border-ui);
  border-radius: 50%;
  width: 46px; height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
  color: var(--text);
  flex-shrink: 0;
}
/* hover 時は枠を太くする（border を太くするとレイアウトがずれるため、外側に box-shadow を足す） */
.theme-toggle:hover,
.copy-btn:hover,
.swap-btn:hover {
  box-shadow: 0 0 0 2px var(--border-ui);
}

/* 押している間は色を反転させる */
.copy-btn:active,
.swap-btn:active {
  background: var(--text);
  border-color: var(--text);
  color: var(--card);
}

/* ── 結果カード ── */
.result-card {
  padding: 1.4rem 1.5rem;
}

.result-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.2rem;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.result-label {
  font-size: 17px;
  font-weight: 700;
  color: var(--label);
}

.ratio-number {
  font-size: 2.8rem;
  font-weight: 900;
  color: var(--text);
  line-height: 1;
}
.ratio-unit {
  font-size: 18px;
  font-weight: 700;
  color: var(--label);
}

/* ── プレビュー ── */
.section-label {
  font-size: 17px;
  font-weight: 700;
  color: var(--label);
  margin-bottom: 0.5rem;
}

.preview-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
  margin-bottom: 1.2rem;
}

.preview-box {
  border-radius: 10px;
  padding: 0.8rem 1rem;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.5;
  border: 2px solid var(--border-ui);
}
.preview-large { font-size: 20px; }
.preview-sublabel {
  font-size: 16px;
  font-weight: 400;
}

/* ── WCAG グリッド ── */
.wcag-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.wcag-item {
  border-radius: 12px;
  padding: 0.65rem 0.3rem;
  text-align: center;
  border: 2px solid var(--border-ui);
  color: var(--label);
}
.wcag-item.pass {
  border-color: var(--pass);
  color: var(--pass);
}
.wcag-item.fail {
  border-color: var(--fail);
  color: var(--fail);
}

.wcag-name {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 0.25rem;
}

.wcag-verdict {
  font-size: 18px;
  font-weight: 900;
}

.wcag-threshold {
  font-size: 16px;
  font-weight: 500;
  margin-top: 0.2rem;
}

/* ── バナー ── */
.aa-banner {
  font-size: 17px;
  font-weight: 900;
  text-align: center;
  color: var(--label);
}
.aa-banner.ok { color: var(--pass); }
.aa-banner.ng { color: var(--fail); }
</style>
</head>
<body>
<script>
  // 最初の描画からブラウザの設定どおりのテーマで表示する（一瞬ライトで表示されないように）
  if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.body.classList.add('dark');
</script>

<button class="theme-toggle" id="themeBtn">
  <span id="themeIcon">🌙</span>
  <span id="themeLabel">ダークに変更</span>
</button>

<main class="app">

  <!-- タイトル -->
  <div class="title-area">
    <h1>🎨 カジュアルカラーコントラストチェッカー</h1>
    <p>文字色と背景色を選んで、見やすさを確認しよう</p>
  </div>

  <!-- 色選択 -->
  <div class="slots-row">
    <h2 class="sr-only">比較する2色</h2>

    <!-- 文字色 -->
    <div class="slot-card card">
      <h3 class="slot-title">🔤 文字の色</h3>
      <div class="color-trigger">
        <input type="color" id="pickerA" value="#1a237e" aria-label="文字の色を選択">
        <div class="eyedrop-badge"><svg viewBox="0 0 24 24" width="14" height="14" fill="#1a1a1a" style="vertical-align:middle;margin-right:3px"><path d="M20.71 5.63l-2.34-2.34a1 1 0 00-1.41 0l-3.12 3.12-1.41-1.42-1.42 1.42 1.41 1.41-6.6 6.6A2 2 0 005 16v3h3a2 2 0 001.42-.59l6.6-6.6 1.41 1.41 1.42-1.42-1.42-1.41 3.12-3.12a1 1 0 000-1.64zM8 17H7v-1l6.6-6.6 1 1z"/></svg>スポイト</div>
      </div>
      <div class="hex-row">
        <span class="hex-value" id="hexA">#1A237E</span>
        <button class="copy-btn" id="copyA" aria-label="文字色をコピー" title="コピー">
          <svg viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3v14h2V3h12V1zm3 4H8C6.9 5 6 5.9 6 7v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        </button>
      </div>
    </div>

    <!-- 入れ替え -->
    <button class="swap-btn" id="swapBtn" title="入れ替え">⇄<span class="sr-only">2色を入れ替え</span></button>

    <!-- 背景色 -->
    <div class="slot-card card">
      <h3 class="slot-title">🟦 背景の色</h3>
      <div class="color-trigger">
        <input type="color" id="pickerB" value="#e8eaf6" aria-label="背景の色を選択">
        <div class="eyedrop-badge"><svg viewBox="0 0 24 24" width="14" height="14" fill="#1a1a1a" style="vertical-align:middle;margin-right:3px"><path d="M20.71 5.63l-2.34-2.34a1 1 0 00-1.41 0l-3.12 3.12-1.41-1.42-1.42 1.42 1.41 1.41-6.6 6.6A2 2 0 005 16v3h3a2 2 0 001.42-.59l6.6-6.6 1.41 1.41 1.42-1.42-1.42-1.41 3.12-3.12a1 1 0 000-1.64zM8 17H7v-1l6.6-6.6 1 1z"/></svg>スポイト</div>
      </div>
      <div class="hex-row">
        <span class="hex-value" id="hexB">#E8EAF6</span>
        <button class="copy-btn" id="copyB" aria-label="背景色をコピー" title="コピー">
          <svg viewBox="0 0 24 24"><path d="M16 1H4C2.9 1 2 1.9 2 3v14h2V3h12V1zm3 4H8C6.9 5 6 5.9 6 7v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 結果カード -->
  <div class="result-card card">
    <h2 class="sr-only">判定結果</h2>

    <div class="result-header">
      <h3 class="result-label">コントラスト比</h3>
      <div>
        <span class="ratio-number" id="ratioValue">--</span>
        <span class="ratio-unit"> : 1</span>
      </div>
    </div>

    <h3 class="section-label">プレビュー</h3>
    <div class="preview-row">
      <div class="preview-box" id="previewNormal">
        資料タイトル<br>
        <span class="preview-sublabel">通常テキスト（16px）</span>
      </div>
      <div class="preview-box preview-large" id="previewLarge">
        大見出し<br>
        <span class="preview-sublabel">大きいテキスト（20px）</span>
      </div>
    </div>

    <h3 class="section-label">WCAG 2.2 基準</h3>
    <div class="wcag-grid">
      <div class="wcag-item" id="wAA">
        <div class="wcag-name">AA<br>テキスト</div>
        <div class="wcag-verdict" id="wAAv">-</div>
        <div class="wcag-threshold">4.5:1以上</div>
      </div>
      <div class="wcag-item" id="wAAA">
        <div class="wcag-name">AAA<br>テキスト</div>
        <div class="wcag-verdict" id="wAAAv">-</div>
        <div class="wcag-threshold">7.0:1以上</div>
      </div>
      <div class="wcag-item" id="wNT">
        <div class="wcag-name">AA<br>非テキスト</div>
        <div class="wcag-verdict" id="wNTv">-</div>
        <div class="wcag-threshold">3.0:1以上</div>
      </div>
    </div>

    <div class="aa-banner" id="aaBanner">計算中...</div>
  </div>

  <!-- 判定結果の読み上げ用（色を確定したときと、入れ替えたときに更新する） -->
  <p class="sr-only" role="status" id="announce"></p>

</main>

<script>
  // テーマ
  // 初期値はブラウザの設定（prefers-color-scheme）に合わせ、設定が変わったときも追従する。
  // ボタンで切り替えたテーマは保存しない
  const themeBtn = document.getElementById('themeBtn');
  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
  let isDark = false;
  function applyTheme(dark) {
    isDark = dark;
    document.body.classList.toggle('dark', isDark);
    document.getElementById('themeIcon').textContent  = isDark ? '☀️' : '🌙';
    document.getElementById('themeLabel').textContent = isDark ? 'ライトに変更' : 'ダークに変更';
  }
  applyTheme(darkQuery.matches);
  darkQuery.addEventListener('change', e => applyTheme(e.matches));
  themeBtn.addEventListener('click', () => applyTheme(!isDark));

  const pickerA = document.getElementById('pickerA');
  const pickerB = document.getElementById('pickerB');

  function hexToRgb(hex) {
    return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
  }
  function luminance({r,g,b}) {
    return [r,g,b].reduce((acc,v,i) => {
      v /= 255;
      v = v <= 0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
      return acc + v * [0.2126,0.7152,0.0722][i];
    }, 0);
  }
  function contrastRatio(h1,h2) {
    const L1=luminance(hexToRgb(h1)), L2=luminance(hexToRgb(h2));
    return (Math.max(L1,L2)+0.05)/(Math.min(L1,L2)+0.05);
  }

  function setWcag(itemId, verdictId, pass) {
    document.getElementById(itemId).className = 'wcag-item ' + (pass?'pass':'fail');
    document.getElementById(verdictId).textContent = pass ? '✓ OK' : '✗ NG';
  }

  // 直近の判定結果（読み上げ用）
  let latest = null;

  function update() {
    const ca = pickerA.value, cb = pickerB.value;

    document.getElementById('hexA').textContent = ca.toUpperCase();
    document.getElementById('hexB').textContent = cb.toUpperCase();

    const ratio = contrastRatio(ca, cb);
    const ratioText = (Math.floor(ratio * 100) / 100).toFixed(2);
    document.getElementById('ratioValue').textContent = ratioText;

    ['previewNormal','previewLarge'].forEach(id => {
      const el = document.getElementById(id);
      el.style.background = cb;
      el.style.color = ca;
    });

    const passAA = ratio >= 4.5, passAAA = ratio >= 7.0, passNT = ratio >= 3.0;
    setWcag('wAA',  'wAAv',  passAA);
    setWcag('wAAA', 'wAAAv', passAAA);
    setWcag('wNT',  'wNTv',  passNT);

    const banner = document.getElementById('aaBanner');
    if (ratio >= 7.0) {
      banner.className = 'aa-banner ok';
      banner.textContent = '🌟 AAA基準クリア！とても見やすい配色です';
    } else if (ratio >= 4.5) {
      banner.className = 'aa-banner ok';
      banner.textContent = '✅ AA基準クリア！通常テキストに使えます';
    } else if (ratio >= 3.0) {
      banner.className = 'aa-banner ng';
      banner.textContent = '⚠️ 非テキスト（アイコン等）はOK、テキストは色を調整して';
    } else {
      banner.className = 'aa-banner ng';
      banner.textContent = '❌ コントラスト不足！どちらかの色を変えてみて';
    }

    latest = { ca, cb, ratioText, passAA, passAAA, passNT, message: banner.textContent };
  }

  // 判定結果をライブリージョンで知らせる。
  // input イベントは色選択ダイアログの操作中に連続して発生するため、
  // 色を確定した change イベントと、入れ替えのときだけ読み上げる
  function announce() {
    const r = latest;
    const v = pass => pass ? 'OK' : 'NG';
    document.getElementById('announce').textContent =
      `文字の色 ${r.ca.toUpperCase()}、背景の色 ${r.cb.toUpperCase()}。` +
      `コントラスト比 ${r.ratioText} 対 1。` +
      `AA テキスト ${v(r.passAA)}、AAA テキスト ${v(r.passAAA)}、AA 非テキスト ${v(r.passNT)}。` +
      r.message;
  }

  pickerA.addEventListener('input', update);
  pickerB.addEventListener('input', update);
  pickerA.addEventListener('change', () => { update(); announce(); });
  pickerB.addEventListener('change', () => { update(); announce(); });

  document.getElementById('swapBtn').addEventListener('click', () => {
    const tmp = pickerA.value;
    pickerA.value = pickerB.value;
    pickerB.value = tmp;
    update();
    announce();
  });

  document.getElementById('copyA').addEventListener('click', () =>
    navigator.clipboard.writeText(pickerA.value.toUpperCase()));
  document.getElementById('copyB').addEventListener('click', () =>
    navigator.clipboard.writeText(pickerB.value.toUpperCase()));

  update();
</script>
</body>
</html>
